server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /learn/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /learn { return 301 /learn/; }

    location = /robots.txt { try_files $uri =404; }
    location = /llms.txt { try_files $uri =404; }
    location = /ai-catalog.json { try_files $uri =404; }

    location /learn-assets/ {
        try_files $uri =404;
        expires 1d;
    }

    location ~ ^/(api|auth|admin|health)(/|$) {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A trusted host-level TLS proxy sets this header in production.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /static/ {
        alias /srv/django-static/;
        expires 7d;
    }

    # Only reviewed learning recordings live in this public media volume.
    location /media/ {
        alias /srv/django-media/;
        add_header X-Content-Type-Options nosniff always;
        expires 1d;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Personal app routes are usable but must not become search results.
    # Let robots fetch them so they can read this noindex directive.
    location ~ ^/(names|arabic|library|qada|worship|calendar|reports|settings|profile|login)/?$ {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        # Keep the branded client error page, but preserve a real HTTP 404.
        error_page 404 /index.html;
    }
}

