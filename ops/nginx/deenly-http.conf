# Initial ACME configuration. Replace with deenly-https.conf after issuance.
server {
    listen 80;
    server_name deenly.uz www.deenly.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/deenly-acme;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}

# Do not serve another site's default HTTPS vhost while this new domain is
# awaiting its own certificate. ACME validation still works over port 80.
server {
    listen 443 ssl;
    server_name deenly.uz www.deenly.uz;
    ssl_reject_handshake on;
}
