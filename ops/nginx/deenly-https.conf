server {
    listen 80;
    server_name deenly.uz www.deenly.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/deenly-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://deenly.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.deenly.uz;
    ssl_certificate /etc/letsencrypt/live/deenly.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deenly.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://deenly.uz$request_uri;
}

server {
    listen 443 ssl;
    server_name deenly.uz;
    ssl_certificate /etc/letsencrypt/live/deenly.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deenly.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
