[project]
name = "deenly-bot"
version = "0.1.0"
description = "Personal multilingual Islamic learning and worship Telegram bot"
authors = [{name = "DeenlyBot"}]
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "aiogram>=3.21,<4.0",
    "django-q2>=1.8,<2.0",
    "hijridate>=2.3,<3.0",
    "python-dotenv>=1.1,<2.0",
    "gunicorn>=23.0,<24.0",
    "aiohttp-socks (>=0.10.1,<1.12.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
pytest-django = "^4.13"
pytest-cov = "^6.2"
ruff = "^0.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
